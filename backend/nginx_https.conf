# Nginx HTTPS 反向代理配置
# 英语学习打卡系统 — 网络安全模块
# 桂林电子科技大学 毕业设计

upstream django_app {
    # Gunicorn 后端服务
    server 127.0.0.1:8000;
}

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

# HTTPS 服务
server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # ──── SSL 证书配置 ────
    # Let's Encrypt 证书或学校内部CA签发证书
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ──── SSL 安全配置 ────
    ssl_protocols TLSv1.2 TLSv1.3;            # 仅启用安全协议版本
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ──── 安全响应头 ────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ──── 静态文件 ────
    location /static/ {
        alias /var/www/english-checkin/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ──── API 反向代理 ────
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ──── API 专用路由 ────
    location /api/ {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 限制请求速率（防刷接口）
        limit_req zone=api_limit burst=20 nodelay;
    }

    # ──── 日志 ────
    access_log /var/log/nginx/english-checkin-access.log;
    error_log  /var/log/nginx/english-checkin-error.log;
}

# 请求速率限制区域
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
